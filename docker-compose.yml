version: '3.8'

services:
  apkmanager:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - apk-storage:/app/apk-storage
    environment:
      - SERVER_PORT=8080
      - APK_STORAGE_LOCATION=/app/apk-storage
      # Change this to a secure key in production
      - API_SECRET_KEY=orvio-secret-key-change-in-production
    restart: unless-stopped

volumes:
  apk-storage: 