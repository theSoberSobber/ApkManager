version: '3.8'

services:
  apkmanager:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"
    volumes:
      - ./apk-storage:/app/apk-storage
    environment:
      - FLASK_APP=ApkManagerSimple.py
      - APK_STORAGE_LOCATION=/app/apk-storage
      # Change this to a secure key in production
      - API_SECRET_KEY=orvio-secret-key-change-in-production
    restart: unless-stopped

volumes:
  apk-storage: 